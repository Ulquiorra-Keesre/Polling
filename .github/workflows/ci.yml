name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest

      - name: Run linter (ruff)
        working-directory: ./backend
        run: |
          ruff check src/ tests/ --exit-zero
          ruff format src/ tests/ --check --diff

      - name: Run type checker (mypy)
        working-directory: ./backend
        run: |
          mypy src/ \
            --ignore-missing-imports \
            --pretty \
            --disable-error-code=assignment \
            --disable-error-code=attr-defined \
            --disable-error-code=return-value \
            --disable-error-code=arg-type \
            --disable-error-code=call-arg \
            --disable-error-code=misc \
            --disable-error-code=list-item \
            --disable-error-code=annotation-unchecked

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: poll_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U test_user; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Run tests with coverage
        working-directory: ./backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/poll_system_test
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/poll_system_test
          SECRET_KEY: test-secret-key-for-ci-only-do-not-use-in-prod
          REFRESH_SECRET_KEY: test-refresh-key-for-ci-only
          APP_ENV: testing
          LOG_LEVEL: DEBUG
        run: |
          python -m pytest tests/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=50 \
            --maxfail=3 \
            --tb=short

      - name: Upload coverage to Codecov (опционально)
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: fals

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
  
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
  
      - name: Run unit tests
        working-directory: ./frontend
        env:
          CI: true
        run: npm run test:unit
  
      - name: Upload Playwright report (if failed)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image digest
        run: |
          echo "Pushed image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.meta.outputs.digest }}"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR (для деплоя)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e  # Останавливаем скрипт при первой ошибке
            
            echo "Starting deployment..."
            cd /opt/poll_system
            
            echo "Pulling latest code..."
            git pull origin main
            
            echo "Creating .env file..."
            cat > .env << EOF
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            REFRESH_SECRET_KEY=${{ secrets.REFRESH_SECRET_KEY }}
            APP_ENV=production
            LOG_LEVEL=INFO
            CORS_ORIGINS=["https://index_poll.com"]
            EOF
            
            echo "Pulling latest Docker images..."
            docker compose pull
            
            echo "Restarting services..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            
            echo "Waiting for services to be healthy..."
            sleep 20
            
            echo "Running health check..."
            if curl -sf http://localhost:8000/health; then
              echo "Backend is healthy!"
            else
              echo "Backend health check failed!"
              docker compose logs backend --tail=50
              exit 1
            fi
            
            echo "Cleaning up old images..."
            docker image prune -f --filter="until=24h"
            
            echo "Deployment completed successfully!"

      - name: Final health check (из runner)
        run: |
          echo "Final health check from GitHub Actions..."
          # curl -sf https://index_poll.com/health || exit 1
          echo "Health check passed!"